Description: Трансляції - застосунок Windows для перегляду каталогу інтернет-радіо, live-відео й адрес RTSP; інтерфейс доступний тринадцятьма мовами. Шукайте, фільтруйте, закріплюйте та додавайте потоки; вибирайте список або сітку з відключними живими мініатюрами; відкривайте відео поверх вікон або на весь екран. Каталог оновлюється лише за командою, локальні дані залишаються на пристрої, у застосунку немає облікового запису, реклами, аналітики й телеметрії. Сумісність відтворення залежить від постачальника, протоколу та кодека.
