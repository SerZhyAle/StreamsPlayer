name: CI

# SP-0256: between releases only the fast tier runs - the checks measured at 5 s or less (canon TESTING_AND_QA
# section 2). No restore, no build, no test suite here: the full build, the suite and every slower check run
# against the tag's own tree in release.yml, and the site's documentation and site-sync gates run in pages.yml
# on the commit it deploys. The fast list and its measured times are in scripts/check-fast.ps1 and AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Exit 0 pass, 1 finding, 2 could not verify (CHECK-VERDICT); the last line names every failed check.
      - name: Fast checks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-fast.ps1
