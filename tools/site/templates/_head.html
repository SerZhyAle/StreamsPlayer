    <!-- PAGE-STYLE section 7 pre-paint resolver: the same text on every page, before the first stylesheet.
         sza-theme and sza-lang are shared with every product page on this origin, so they hold exactly
         dark/light and ru/en/ua. -->
    <script>
(function(){try{
  var t=localStorage.getItem('sza-theme');
  if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  var l=localStorage.getItem('sza-lang');
  if(l==='uk')l='ua';
  if(l!=='ru'&&l!=='en'&&l!=='ua'){var n=(navigator.language||'en').toLowerCase();l=n.indexOf('ru')==0?'ru':n.indexOf('uk')==0?'ua':'en';}
  document.documentElement.setAttribute('data-lang',l);
}catch(e){}})();
    </script>
    <script>
      (function () {
        // Language redirect. Only the canonical English root redirects: a visitor who asked for
        // /de/ typed or followed that URL and must keep it, and redirecting from a language folder
        // would fight the visitor and risk a loop. Runs before paint so no wrong-language flash.
        var root = document.documentElement;
        if (root.dataset.entry !== "true") {
          return;
        }
        var urls = {};
        try {
          urls = JSON.parse(document.getElementById("language-urls").textContent);
        } catch (error) {
          return;
        }
        // sza-lang holds only ru, en or ua (PAGE-STYLE section 7), so a further locale chosen here is
        // remembered in a key of this product, together with the shared value current at that moment:
        // it counts only while nobody has changed the shared language since.
        var shared = null;
        var further = "";
        try {
          shared = localStorage.getItem("sza-lang");
          further = localStorage.getItem("streamsplayer-locale") || "";
        } catch (error) {
          // No storage: the browser's own preference decides below.
        }
        if (shared === "uk") {
          shared = "ua";
        }
        if (shared !== "ru" && shared !== "en" && shared !== "ua") {
          shared = null;
        }
        var target = null;
        var parts = further.split("@");
        if (parts.length === 2 && urls[parts[0]] && parts[1] === (shared || "")) {
          target = parts[0];
        } else if (shared) {
          target = shared === "ua" ? "uk" : shared;
        } else {
          // Walk the visitor's preference list in order and match on the base subtag, so de-AT
          // reaches the German page. The table comes from the generated page, never from a list
          // written here.
          var preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en"];
          for (var i = 0; i < preferred.length && !target; i += 1) {
            var base = String(preferred[i]).toLowerCase().split("-")[0];
            if (urls[base]) {
              target = base;
            }
          }
        }
        if (target && target !== "en" && urls[target]) {
          window.location.replace(urls[target]);
        }
      })();
    </script>
