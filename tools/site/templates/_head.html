    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{page.description}}">
    <meta name="theme-color" content="#0a0f0a">
    <title>{{page.title}}</title>
    <link rel="canonical" href="{{page.canonical}}">
{{page.alternates}}
    <link rel="icon" href="{{page.base}}assets/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{page.base}}assets/apple-touch-icon.png">
    <script type="application/json" id="language-urls">{{page.languageUrls}}</script>
    <script>
      (function () {
        var root = document.documentElement;
        var systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var theme = systemTheme;
        var stored = null;
        try {
          theme = localStorage.getItem("streamsplayer-theme") || systemTheme;
          stored = localStorage.getItem("streamsplayer-lang");
        } catch (error) {
          theme = systemTheme;
        }
        root.dataset.theme = theme;

        // Language redirect. Only the canonical English root redirects: a visitor who asked for
        // /de/ typed or followed that URL and must keep it, and redirecting from a language folder
        // would fight the visitor and risk a loop. Runs before paint so no wrong-language flash.
        if (root.dataset.entry !== "true") {
          return;
        }
        var urls = {};
        try {
          urls = JSON.parse(document.getElementById("language-urls").textContent);
        } catch (error) {
          return;
        }
        var target = null;
        if (stored && urls[stored]) {
          target = stored;
        } else if (!stored) {
          // Walk the visitor's preference list in order and match on the base subtag, so de-AT
          // reaches the German page. The table comes from the generated page, never from a list
          // written here.
          var preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en"];
          for (var i = 0; i < preferred.length && !target; i += 1) {
            var base = String(preferred[i]).toLowerCase().split("-")[0];
            if (urls[base]) {
              target = base;
            }
          }
        }
        if (target && target !== root.dataset.lang) {
          window.location.replace(urls[target]);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{page.base}}style.css">
    <script src="{{page.base}}site.js" defer></script>
